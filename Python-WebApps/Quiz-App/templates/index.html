<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fundmentals of Python</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom styles -->
  <style>
    /* Make radio outer circle black */
    .form-check-input {
      border: 2px solid #000;
    }

    .form-check-input:checked {
      background-color: #000;
      border-color: #000;
    }
  </style>
</head>
<body>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>🐍 Python Quiz</h4>
    <h5 class="text-danger">⏱ Time Left: <span id="timer">60:00</span></h5>
  </div>

  <div id="quiz-box" class="card p-4 shadow">
    <h5 id="question">Loading...</h5>
    <div id="options" class="mt-3"></div>

    <div class="d-flex justify-content-between mt-4">
      <button class="btn btn-secondary" onclick="prevQuestion()">⬅ Previous</button>
      <button class="btn btn-primary" onclick="nextQuestion()" id="nextBtn">Next ➡</button>
      <button class="btn btn-success d-none" onclick="showResult()" id="submitBtn">Submit ✅</button>
    </div>
  </div>

  <div id="result" class="text-center mt-4"></div>
</div>

<script src="{{ url_for('static', filename='WebApp.js') }}"></script>
</body>
</html>
